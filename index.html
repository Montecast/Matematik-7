<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matematik 7.">
<title>Matematik 7. klasse · øveprøver</title>
<style>
  :root{
    --papir:#F6F7F3; --tern:#DCE3DA; --tern-kraftig:#C6D1C4;
    --blaek:#16211C; --blaek-svag:#5F6C64; --groen:#1D6B5B;
    --rigtig:#2E7D52; --forkert:#B3372C; --kant:#CBD3C9; --guld:#9A7B1F;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{background:var(--papir);
    background-image:linear-gradient(var(--tern) 1px,transparent 1px),linear-gradient(90deg,var(--tern) 1px,transparent 1px);
    background-size:24px 24px;color:var(--blaek);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(18px,0.9vw + 14px,22px);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh}
  .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ark{width:100%;max-width:900px;margin:0 auto;min-height:100dvh;
    padding:clamp(24px,3.4vw,44px) clamp(22px,4vw,56px) 96px;
    padding-left:max(clamp(22px,4vw,56px),env(safe-area-inset-left));
    padding-right:max(clamp(22px,4vw,56px),env(safe-area-inset-right))}

  .hilsen{font-size:clamp(19px,2.2vw,26px);color:var(--groen);margin:0 0 2px}
  .titel{font-size:clamp(36px,7vw,76px);line-height:1.02;font-weight:600;letter-spacing:-0.02em;margin:0 0 4px}
  .undertitel{font-size:clamp(21px,3.4vw,34px);color:var(--blaek-svag);margin:0 0 26px;font-weight:400}

  .noegletal{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
  .noegletal div{background:#fff;border:1px solid var(--kant);padding:14px 18px;flex:1 1 120px}
  .noegletal b{display:block;font-size:clamp(26px,3.4vw,38px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .noegletal span{font-size:13px;color:var(--blaek-svag)}

  .liste{border-top:1px solid var(--kant)}
  .raekke{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:14px 0;border-bottom:1px solid var(--kant)}
  .raekke.national{border-left:3px solid var(--guld);padding-left:14px;background:rgba(154,123,31,.05)}
  .raekke .venstre b{display:block;font-size:clamp(18px,1.9vw,21px);font-weight:600}
  .raekke .venstre span{font-size:13px;color:var(--blaek-svag)}
  .raekke .hoejre{display:flex;align-items:center;gap:12px}
  .mrk{font-size:13px;color:var(--blaek-svag);white-space:nowrap}
  .mrk.klar{color:var(--rigtig);font-weight:600} .mrk.igang{color:var(--guld);font-weight:600}
  .mrk.naeste{color:var(--groen);font-weight:600}
  .fodnote{font-size:14px;color:var(--blaek-svag);margin:18px 0 0;max-width:62ch}

  button{font:inherit;cursor:pointer;border-radius:2px;touch-action:manipulation}
  .knap{background:var(--groen);color:#fff;border:none;padding:14px 26px;min-height:48px;font-size:17px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500}
  .knap.lille{padding:10px 18px;min-height:44px;font-size:15px}
  .knap:hover{background:#17574a}
  .knap.sekundaer{background:transparent;color:var(--blaek);border:1px solid var(--kant)}
  .knap.sekundaer:hover{border-color:var(--blaek);background:rgba(0,0,0,.03)}
  .knap:disabled{opacity:.35;cursor:default}
  button:focus-visible,input:focus-visible{outline:2px solid var(--groen);outline-offset:2px}

  .status{border-bottom:1px solid var(--kant);padding-bottom:14px;margin-bottom:24px}
  .statusraekke{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
  .ptitel{font-size:15px;color:var(--blaek-svag);margin:0 0 10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ur{font-variant-numeric:tabular-nums;font-size:clamp(24px,2.4vw,32px);font-weight:600}
  .ur.knap-paa-tiden{color:var(--forkert)}
  .ur small{display:block;font-size:12px;font-weight:400;color:var(--blaek-svag)}
  .gemt{font-size:13px;color:var(--blaek-svag);text-align:right;min-height:18px}
  .felter{display:flex;gap:2px;flex-wrap:wrap}
  .felt{width:clamp(30px,3.4vw,40px);height:clamp(30px,3.4vw,40px);padding:0;border:none;background:none;
    display:flex;align-items:center;justify-content:center}
  .felt i{display:block;width:clamp(16px,1.9vw,22px);height:clamp(16px,1.9vw,22px);border:1px solid var(--tern-kraftig)}
  .felt[data-svaret="ja"] i{background:var(--groen);border-color:var(--groen)}
  .felt[aria-current="true"] i{outline:2px solid var(--blaek);outline-offset:2px}

  .omraade{font-size:14px;color:var(--groen);margin-bottom:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .nr{font-size:14px;color:var(--blaek-svag);margin-bottom:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .sporgsmaal{font-size:clamp(23px,3.1vw,38px);line-height:1.3;margin:0 0 clamp(30px,4vh,52px);font-weight:500;max-width:min(100%,30ch)}
  .svarlinje{display:flex;align-items:baseline;gap:14px;margin-bottom:clamp(38px,5vh,64px);flex-wrap:wrap}
  .svarlinje label{font-size:16px;color:var(--blaek-svag)}
  input[type="text"]{font:inherit;font-size:clamp(26px,2.8vw,38px);font-weight:600;width:clamp(220px,32vw,340px);max-width:100%;
    padding:8px 4px;border:none;border-bottom:2px solid var(--blaek);background:transparent;color:var(--blaek);border-radius:0}
  .enhed{font-size:20px;color:var(--blaek-svag)}
  .navigation{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .udskriftshoved{display:none}
  .roshoved{font-size:clamp(22px,2.6vw,30px);color:var(--groen);margin:0 0 10px;font-weight:500}
  .score{border-top:2px solid var(--blaek);padding-top:20px;margin-bottom:8px}
  .score-tal{font-size:clamp(52px,10vw,108px);line-height:1;font-weight:600;letter-spacing:-0.03em}
  .score-tal span{font-size:.42em;color:var(--blaek-svag);font-weight:400}
  .score-note{color:var(--blaek-svag);font-size:16px;margin-top:6px}

  .maerker{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0}
  .maerke{background:#fff;border:1px solid var(--kant);padding:11px 15px;flex:1 1 170px;max-width:240px}
  .maerke.guld{border-color:var(--guld);border-top:3px solid var(--guld)}
  .maerke b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
  .maerke span{font-size:13px;color:var(--blaek-svag);line-height:1.35;display:block}
  .maerke em{font-style:normal;color:var(--guld);font-size:15px;margin-right:5px}

  .udvikling{margin:0;border-top:1px solid var(--kant)}
  .udvikling .r{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:1px solid var(--kant);font-size:clamp(16px,1.7vw,19px)}
  .udvikling .r b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .udvikling .r .foer{color:var(--blaek-svag);font-size:.82em;margin-left:10px;font-weight:400}
  .pil{font-weight:600;margin-left:8px}
  .pil.op{color:var(--rigtig)} .pil.ned{color:var(--forkert)} .pil.lige{color:var(--blaek-svag)}

  .kurve{margin:26px 0 0;background:#fff;border:1px solid var(--kant);padding:18px 20px 12px}
  .kurve h3{margin:0 0 2px;font-size:17px;font-weight:600}
  .kurve p{margin:0 0 12px;font-size:13px;color:var(--blaek-svag)}
  .kurve svg{display:block;width:100%;height:96px;overflow:visible}

  .fokus{background:#fff;border:1px solid var(--kant);border-top:3px solid var(--forkert);padding:20px 22px;margin:26px 0 0}
  .fokus h3{margin:0 0 4px;font-size:20px;font-weight:600}
  .fokus p.led{margin:0 0 14px;font-size:15px;color:var(--blaek-svag)}
  .fokus ul{margin:0;padding-left:20px}
  .fokus li{margin-bottom:8px;font-size:clamp(16px,1.7vw,19px)}
  .fokus li span{color:var(--blaek-svag);font-size:14px}
  .fokus.alt-rigtigt{border-top-color:var(--rigtig)}
  .fokus.loest{border-top-color:var(--rigtig)} .fokus.loest li b{color:var(--rigtig)}

  .rettelse{border-left:3px solid var(--kant);padding:2px 0 2px 16px;margin:0 0 24px;break-inside:avoid;page-break-inside:avoid}
  .rettelse.ja{border-left-color:var(--rigtig)} .rettelse.nej{border-left-color:var(--forkert)}
  .rettelse h3{font-size:clamp(19px,1.9vw,23px);font-weight:500;margin:0 0 8px;line-height:1.4}
  .rettelse .emne{font-size:13px;color:var(--blaek-svag);margin:0 0 6px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .rettelse .dit{font-size:15px;color:var(--blaek-svag);margin:0 0 4px}
  .rettelse .dit i{font-style:normal;color:var(--forkert);text-decoration:line-through}
  .rettelse .facit{font-size:16px;margin:0 0 6px} .rettelse .facit b{color:var(--rigtig)}
  .rettelse .hvorfor{font-size:15px;color:var(--blaek-svag);margin:0}

  h2.afsnit{font-size:15px;color:var(--blaek-svag);font-weight:500;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    border-bottom:1px solid var(--kant);padding-bottom:6px;margin:36px 0 22px}
  .skjult{display:none}

  @media (prefers-reduced-motion:no-preference){
    #opgave{animation:ind .18s ease-out} @keyframes ind{from{opacity:.4}to{opacity:1}}
    .maerke{animation:frem .35s ease-out both} @keyframes frem{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .maerke:nth-child(2){animation-delay:.07s} .maerke:nth-child(3){animation-delay:.14s}
    .maerke:nth-child(4){animation-delay:.21s} .maerke:nth-child(5){animation-delay:.28s}
  }
  @media print{
    @page{margin:16mm}
    body{background:#fff;background-image:none;font-size:11pt;color:#000;min-height:auto}
    .ark{max-width:100%;padding:0;min-height:auto}
    .sporgsmaal{max-width:100%}
    .status,.navigation,.knap,#oversigt,#proeve,.gemt{display:none !important}
    .udskriftshoved{display:block;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:18px}
    .udskriftshoved h1{font-size:16pt;margin:0 0 2px;font-weight:600}
    .udskriftshoved p{margin:0;font-size:10pt;color:#444}
    .score{border-top:none;padding-top:0} .score-tal{font-size:34pt}
    .maerke,.fokus,.kurve{border:1px solid #000;background:#fff}
    .rettelse .hvorfor,.rettelse .dit,.rettelse .emne{color:#444}
  }

</style>
</head>
<body>
<main class="ark">
  <section id="oversigt"></section>

  <section id="proeve" class="skjult">
    <p class="ptitel ui" id="ptitel"></p>
    <div class="status ui">
      <div class="statusraekke">
        <div class="ur" id="ur">45:00<small>tilbage</small></div>
        <div class="gemt" id="gemt"></div>
      </div>
      <div class="felter" id="felter" role="group" aria-label="Spring til opgave"></div>
    </div>
    <div id="opgave">
      <p class="omraade" id="omraade"></p>
      <p class="nr" id="nr"></p>
      <p class="sporgsmaal" id="sporgsmaal"></p>
      <div class="svarlinje">
        <label for="svar">Svar</label>
        <input type="text" id="svar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span class="enhed" id="enhed"></span>
      </div>
    </div>
    <div class="navigation ui">
      <button class="knap sekundaer" id="forrige">Forrige</button>
      <button class="knap" id="naeste">Næste</button>
      <button class="knap skjult" id="aflever">Aflever</button>
      <button class="knap sekundaer" id="afbryd">Gem og luk</button>
    </div>
  </section>

  <section id="resultat" class="skjult"></section>
</main>
<script>
/* ---------- tilfældighed og formatering ---------- */
function rng(fro){ let s = fro >>> 0; return function(){ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function h(r,a,b){ return a + Math.floor(r()*(b-a+1)); }
function vaelg(r,liste){ return liste[Math.floor(r()*liste.length)]; }
function dk(n){
  if(Number.isInteger(n)) return String(n);
  return String(Math.round(n*1000)/1000).replace(".", ",");
}
function tal(n){ const s = dk(n); return {f:s, alt:[s, String(Math.round(n*1000)/1000)]}; }
function bland(r, liste){
  const a = liste.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

const TA = "Tal og algebra", GM = "Geometri og m\u00e5ling", SS = "Statistik og sandsynlighed";

/* ---------- generatorer ----------
   Hver returnerer: {fp, q, e, f, alt, h, p}  (p = parametre, bruges af testharness) */
const G = [

{id:"negativ", t:"Negative tal", o:TA, gen:function(r){
  const a=h(r,4,20), b=h(r,5,28), c=h(r,3,16);
  const sv = -a + b - c;
  return {fp:"negativ:"+a+","+b+","+c, p:[a,b,c],
    q:"Udregn: \u2212"+a+" + "+b+" \u2212 "+c, e:"", f:dk(sv), alt:[dk(sv), String(sv)],
    h:"Regn fra venstre: \u2212"+a+" + "+b+" = "+dk(-a+b)+", og "+dk(-a+b)+" \u2212 "+c+" = "+dk(sv)+"."};
}},

{id:"brokdel", t:"Br\u00f8kdel af et tal", o:TA, gen:function(r){
  const q=vaelg(r,[2,3,4,5,6,8]), p=h(r,1,q-1), k=h(r,4,20), N=q*k;
  const sv = p*k;
  return {fp:"brokdel:"+p+","+q+","+N, p:[p,q,N],
    q:"Hvad er "+p+"/"+q+" af "+N+"?", e:"", f:String(sv), alt:[String(sv)],
    h:N+" \u00f7 "+q+" = "+k+", og "+k+" \u00b7 "+p+" = "+sv+"."};
}},

{id:"decimalgange", t:"Decimaltal", o:TA, gen:function(r){
  const d=vaelg(r,[20,25,30,40,50,60,75,80]), N=20*h(r,2,25);
  const sv = d*N/100;
  return {fp:"decimalgange:"+d+","+N, p:[d,N],
    q:"Udregn: "+dk(d/100)+" \u00b7 "+N, e:"", f:dk(sv), alt:[dk(sv), String(sv)],
    h:dk(d/100)+" af "+N+". "+N+" \u00b7 "+d+" = "+(N*d)+", og "+(N*d)+" \u00f7 100 = "+dk(sv)+"."};
}},

{id:"decimaldel", t:"Decimaltal", o:TA, gen:function(r){
  const N=h(r,11,99)*vaelg(r,[1,1,10]), k=vaelg(r,[10,100]);
  const sv = N/k;
  return {fp:"decimaldel:"+N+","+k, p:[N,k],
    q:"Udregn: "+N+" \u00f7 "+k, e:"", f:dk(sv), alt:[dk(sv), String(sv)],
    h:"Ved division med "+k+" flyttes kommaet "+(k===10?"\u00e9n plads":"to pladser")+" til venstre: "+dk(sv)+"."};
}},

{id:"procent", t:"Procentregning", o:TA, gen:function(r){
  const p=vaelg(r,[5,10,15,20,25,30,40,50,60,75]), N=20*h(r,3,30);
  const sv = p*N/100;
  return {fp:"procent:"+p+","+N, p:[p,N],
    q:"Hvor meget er "+p+" % af "+N+"?", e:"", f:dk(sv), alt:[dk(sv), String(sv)],
    h:"1 % af "+N+" er "+dk(N/100)+". Gang med "+p+": "+dk(sv)+"."};
}},

{id:"procentned", t:"Procentregning", o:TA, gen:function(r){
  const p=vaelg(r,[10,20,25,50]), N=vaelg(r,[100,200,240,300,360,400,500,600,800]);
  const sv = N - p*N/100;
  return {fp:"procentned:"+p+","+N, p:[p,N],
    q:"En vare koster "+N+" kr. Den s\u00e6ttes ned med "+p+" %. Hvad koster den nu?", e:"kr",
    f:dk(sv)+" kr", alt:[dk(sv)],
    h:p+" % af "+N+" er "+dk(p*N/100)+". "+N+" \u2212 "+dk(p*N/100)+" = "+dk(sv)+" kr."};
}},

{id:"ligningplus", t:"Ligninger", o:TA, gen:function(r){
  const a=h(r,2,9), x=h(r,2,14), b=h(r,2,25), c=a*x+b;
  return {fp:"ligningplus:"+a+","+b+","+c, p:[a,b,c],
    q:"L\u00f8s ligningen: "+a+"x + "+b+" = "+c, e:"", f:"x = "+x, alt:[String(x),"x="+x],
    h:"Tr\u00e6k "+b+" fra p\u00e5 begge sider: "+a+"x = "+(c-b)+". Divider med "+a+": x = "+x+"."};
}},

{id:"ligningminus", t:"Ligninger", o:TA, gen:function(r){
  const a=h(r,2,9), x=h(r,2,14), b=h(r,2,25), c=a*x-b;
  return {fp:"ligningminus:"+a+","+b+","+c, p:[a,b,c],
    q:"L\u00f8s ligningen: "+a+"x \u2212 "+b+" = "+c, e:"", f:"x = "+x, alt:[String(x),"x="+x],
    h:"L\u00e6g "+b+" til p\u00e5 begge sider: "+a+"x = "+(c+b)+". Divider med "+a+": x = "+x+"."};
}},

{id:"reduktion", t:"Reduktion af udtryk", o:TA, gen:function(r){
  const v=vaelg(r,["a","b","x","y","m"]);
  const k1=h(r,2,9), k2=h(r,1,5), k3=h(r,1,4), kon=h(r,2,12);
  const sum=k1-k2+k3;
  const svar = sum+v+" + "+kon;
  return {fp:"reduktion:"+v+","+k1+","+k2+","+k3+","+kon, p:[k1,k2,k3,kon],
    q:"Reducer udtrykket: "+k1+v+" + "+kon+" \u2212 "+(k2===1?"":k2)+v+" + "+k3+v, e:"",
    f:svar, alt:[sum+v+"+"+kon, kon+"+"+sum+v],
    h:"L\u00e6g "+v+"-leddene sammen: "+k1+" \u2212 "+k2+" + "+k3+" = "+sum+". Tallet "+kon+" st\u00e5r alene, s\u00e5 der st\u00e5r "+svar+"."};
}},

{id:"potens", t:"Potenser", o:TA, gen:function(r){
  const par=vaelg(r,[[2,3],[2,4],[2,5],[2,6],[2,7],[3,2],[3,3],[3,4],[4,2],[4,3],[5,2],[5,3],[6,2],[6,3],[7,2],[8,2],[9,2],[10,2],[10,3],[10,4],[11,2],[12,2]]);
  const b=par[0], e2=par[1], sv=Math.pow(b,e2);
  const ovre=["\u2070","\u00b9","\u00b2","\u00b3","\u2074","\u2075","\u2076","\u2077"];
  return {fp:"potens:"+b+","+e2, p:[b,e2],
    q:"Hvad er "+b+ovre[e2]+"?", e:"", f:String(sv), alt:[String(sv)],
    h:b+" ganget med sig selv "+e2+" gange: "+new Array(e2).fill(b).join(" \u00b7 ")+" = "+sv+". Det er ikke "+b+" \u00b7 "+e2+"."};
}},

{id:"brokdecimal", t:"Br\u00f8k til decimaltal", o:TA, gen:function(r){
  const n=vaelg(r,[2,4,5,10,20,25,50]), t=h(r,1,n-1);
  const sv=t/n;
  return {fp:"brokdecimal:"+t+","+n, p:[t,n],
    q:"Skriv "+t+"/"+n+" som decimaltal.", e:"", f:dk(sv), alt:[dk(sv), String(sv)],
    h:"Forl\u00e6ng til hundrededele: "+t+"/"+n+" = "+dk(sv*100)+"/100 = "+dk(sv)+". Husk cifret 0 f\u00f8r kommaet."};
}},

{id:"brokplus", t:"Br\u00f8kregning", o:TA, gen:function(r){
  const par=vaelg(r,[[2,3],[2,5],[3,4],[3,6],[4,5],[2,6],[3,5],[4,6],[5,10],[2,8],[3,9],[4,8],[2,4],[2,10],[3,12],[4,12],[5,6],[6,8],[2,7],[3,7],[4,10],[5,15],[6,9],[2,12],[3,10],[4,9]]);
  const a=par[0], b=par[1];
  const t=b+a, n=a*b;
  const g=(function gcd(x,y){return y?gcd(y,x%y):x;})(t,n);
  const sv=(t/g)+"/"+(n/g);
  return {fp:"brokplus:"+a+","+b, p:[a,b],

/* ---------- sammensætning af en prøve ---------- */
const FORDELING = [[TA,11],[GM,6],[SS,4]];

function byg(proeveNr, brugte, svageEmner, fro){
  const r = rng(fro);
  const opgaver = [];
  const brugtSet = new Set(brugte);
  const fpNu = new Set();

  FORDELING.forEach(function(par){
    const omraade = par[0], antal = par[1];
    const kandidater = G.filter(function(g){ return g.o === omraade; });
    let brugteIder = {};
    for(let i=0;i<antal;i++){
      // vægtning: svage emner tæller tre gange, generatorer brugt i denne prøve tæller mindre
      const pulje = [];
      kandidater.forEach(function(g){
        const antalBrugt = brugteIder[g.id] || 0;
        const svag = svageEmner.indexOf(g.t) !== -1;
        const trappe = svag ? [16,10,5,0] : [3,1,0,0];
        const v = trappe[Math.min(antalBrugt, 3)];
        for(let k=0;k<v;k++) pulje.push(g);
      });
      const valgtePulje = pulje.length ? pulje : kandidater;
      let lagt = false;
      for(let forsog=0; forsog<400 && !lagt; forsog++){
        const g = vaelg(r, valgtePulje);
        const o = g.gen(r);
        if(!o) continue;
        if(brugtSet.has(o.fp) || fpNu.has(o.fp)) continue;
        o.t = g.t; o.o = g.o; o.gid = g.id;
        opgaver.push(o); fpNu.add(o.fp);
        brugteIder[g.id] = (brugteIder[g.id]||0)+1;
        lagt = true;
      }
      if(!lagt){ // nødudgang: accepter enhver ubrugt fra området
        for(let forsog=0; forsog<2000 && !lagt; forsog++){
          const g = vaelg(r, kandidater);
          const o = g.gen(r);
          if(!o || brugtSet.has(o.fp) || fpNu.has(o.fp)) continue;
          o.t = g.t; o.o = g.o; o.gid = g.id;
          opgaver.push(o); fpNu.add(o.fp); lagt = true;
        }
      }
    }
  });
  return opgaver;
}

/* ---------- lager ---------- */
const reserve = {};
function laes(n, standard){
  try{ const r = localStorage.getItem(n); if(r !== null) return JSON.parse(r); }catch(f){}
  if(reserve[n] !== undefined) return reserve[n];
  return standard;
}
function skriv(n, v){
  reserve[n] = v;
  try{ localStorage.setItem(n, JSON.stringify(v)); return true; }catch(f){ return false; }
}
function historik(){ const h = laes(N_HIST, null); if(h) return h; skriv(N_HIST, SEED_HIST); return SEED_HIST.slice(); }

/* ---------- svage emner ---------- */
function svageEmner(){
  const h = historik();
  const t = {};
  h.slice(-4).forEach(function(r){
    if(r.emner){
      Object.keys(r.emner).forEach(function(e){
        t[e] = t[e] || [0,0];
        t[e][0] += r.emner[e][0]; t[e][1] += r.emner[e][1];
      });
    }else if(r.forkerte){
      r.forkerte.forEach(function(e){ t[e] = t[e] || [0,0]; t[e][1] += 1; });
    }
  });
  return Object.keys(t)
    .filter(function(e){ return t[e][1] > 0 && t[e][0]/t[e][1] < 0.75; })
    .sort(function(a,b){ return (t[a][0]/t[a][1]) - (t[b][0]/t[b][1]); })
    .slice(0,5);
}

    .replace(/\s+/g,"").replace(/,/g,".")
    .replace(/\u00b2/g,"2").replace(/\u00b3/g,"3")
    .replace(/(kr|kg|km|cm3|cm2|mm|ml|cl|dl|cm|grader|procent|\u00b0|%|g|m|l)+$/,"")
    .replace(/^x=/,"").replace(/\.$/,"").replace(/^\+/,"");
}
function rigtigt(o, s){
  const g = normaliser(s || "");
  if(!g) return false;
  return o.alt.some(function(a){ return normaliser(a) === g; });
}

/* ---------- oversigt ---------- */
function tegnOversigt(){
  const h = historik(), ig = igangSaet();
  const bedste = h.length ? Math.max.apply(null, h.map(function(r){ return r.point; })) : null;
  const taget = {};
  h.forEach(function(r){ if(r.proeve >= 1) taget[r.proeve] = r; });
  const naeste = (function(){ for(let i=1;i<=ANTAL_PROEVER;i++) if(!taget[i]) return i; return null; })();

  let html = '<p class="hilsen ui">Velkommen, '+ELEV+'</p><h1 class="titel">Matematik</h1>'
    + '<p class="undertitel">7. klassetrin \u00b7 '+ANTAL_PROEVER+' pr\u00f8ver</p>';

  html += '<div class="noegletal ui">'
    + '<div><b>'+(bedste===null?"\u2013":bedste+"/21")+'</b><span>rekord</span></div>'
    + '<div><b>'+Object.keys(taget).length+'/'+ANTAL_PROEVER+'</b><span>pr\u00f8ver taget</span></div>'
    + '<div><b>'+brugte().length+'</b><span>opgaver m\u00f8dt</span></div></div>';

  const svg = kurve(h);
  if(svg) html += '<div class="kurve ui"><h3>Point over tid</h3><p>Nyeste til h\u00f8jre.</p>'+svg+'</div>';

  const sv = svageEmner();
  if(sv.length){
    html += '<div class="fokus ui"><h3>Det tr\u00e6nes der ekstra i</h3>'
      + '<p class="led">Opgaverne i n\u00e6ste pr\u00f8ve v\u00e6gtes mod disse emner.</p><ul>'
      + sv.map(function(e){ return '<li>'+e+'</li>'; }).join('') + '</ul></div>';
  }

  html += '<h2 class="afsnit">Pr\u00f8verne</h2><div class="liste ui">';
  for(let i=1;i<=ANTAL_PROEVER;i++){
    const r = taget[i], igang = ig[i] && !ig[i].afleveret;
    const nat = erNational(i);
    let status, knap;
    if(igang){ status = '<span class="mrk igang">P\u00e5begyndt</span>'; knap = "Forts\u00e6t"; }
    else if(r){ status = '<span class="mrk klar">'+r.point+' af 21</span>'; knap = "Tag igen"; }
    else if(i === naeste){ status = '<span class="mrk naeste">Anbefalet n\u00e6ste</span>'; knap = "Start"; }
    else { status = '<span class="mrk">Ikke taget</span>'; knap = "Start"; }
    html += '<div class="raekke'+(nat?' national':'')+'">'
      + '<div class="venstre"><b>'+proeveNavn(i)+'</b>'
      + '<span>'+(nat ? "Almindelig sammens\u00e6tning, ingen ekstra v\u00e6gtning"
                      : "Tilpasses det der driller") + '</span></div>'
      + '<div class="hoejre">'+status+'<button class="knap lille" data-nr="'+i+'">'+knap+'</button></div></div>';
  }
  html += '</div>';
  html += '<p class="fodnote ui">Opgaverne laves med nye tal hver gang. Ingen opgave gentages \u2014 heller ikke fra de pr\u00f8ver der allerede er taget.</p>';
  html += '<div class="navigation ui" style="margin-top:22px"><button class="knap sekundaer" id="nulstilalt">Nulstil alle resultater</button></div>';

  el("oversigt").innerHTML = html;
  Array.prototype.forEach.call(el("oversigt").querySelectorAll("button[data-nr]"), function(b){
    b.addEventListener("click", function(){ start(parseInt(b.dataset.nr,10)); });
  });
  el("nulstilalt").addEventListener("click", function(){
    if(confirm("Slet alle resultater og start forfra? Det kan ikke fortrydes.")){
      [N_HIST,N_BRUGT,N_IGANG].forEach(function(n){ try{ localStorage.removeItem(n); }catch(f){} delete reserve[n]; });
      location.reload();
    }
  });
  vis("oversigt");
}

/* ---------- start / genoptag ---------- */
function start(nr){
  const ig = igangSaet();
  if(ig[nr] && !ig[nr].afleveret){
    AKTIV = ig[nr];
  }else{
    const fro = Date.now() ^ (nr*2654435761);
    const opgaver = byg(nr, brugte(), erNational(nr) ? [] : svageEmner(), fro >>> 0);
    AKTIV = {nr:nr, opgaver:opgaver, svar:new Array(opgaver.length).fill(""), nu:0, sekunder:45*60, afleveret:false};
    const b = brugte().concat(opgaver.map(function(o){ return o.fp; }));
    skriv(N_BRUGT, b);
    gemIgang();
  }
  el("ptitel").textContent = proeveNavn(AKTIV.nr);
  visOpgave(); visUr();
  clearInterval(urId); urId = setInterval(tik, 1000);
  vis("proeve");
}
function gemIgang(kvit){
  const ig = igangSaet(); ig[AKTIV.nr] = AKTIV;
  const ok = skriv(N_IGANG, ig);
  if(kvit) kvitter(ok ? "Gemt" : "Gemt i denne fane");
}
let kvitId = null;
function kvitter(t){ el("gemt").textContent = t; clearTimeout(kvitId); kvitId = setTimeout(function(){ el("gemt").textContent = ""; }, 1600); }

/* ---------- afvikling ---------- */
function tegnFelter(){
  const b = el("felter"); b.innerHTML = "";
  AKTIV.opgaver.forEach(function(_, i){
    const k = document.createElement("button");
    k.className = "felt"; k.type = "button"; k.innerHTML = "<i></i>";
    k.setAttribute("aria-label", "Opgave " + (i+1));
    if(AKTIV.svar[i] && AKTIV.svar[i].trim()) k.dataset.svaret = "ja";
    if(i === AKTIV.nu) k.setAttribute("aria-current", "true");
    k.addEventListener("click", function(){ gem(); AKTIV.nu = i; visOpgave(); gemIgang(); });
    b.appendChild(k);
  });
}
function visOpgave(){
  const o = AKTIV.opgaver[AKTIV.nu];
  el("omraade").textContent = o.o;
  el("nr").textContent = "Opgave " + (AKTIV.nu+1) + " af " + AKTIV.opgaver.length;
  el("sporgsmaal").textContent = o.q;
  el("enhed").textContent = o.e || "";
  el("svar").value = AKTIV.svar[AKTIV.nu];
  el("forrige").disabled = (AKTIV.nu === 0);
  el("naeste").classList.toggle("skjult", AKTIV.nu === AKTIV.opgaver.length-1);
  el("aflever").classList.toggle("skjult", AKTIV.nu !== AKTIV.opgaver.length-1);
  tegnFelter(); el("svar").focus();
}
function gem(){ AKTIV.svar[AKTIV.nu] = el("svar").value; }
function visUr(){
  const s = Math.max(AKTIV.sekunder, 0);
  el("ur").innerHTML = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") + "<small>tilbage</small>";
  el("ur").classList.toggle("knap-paa-tiden", s <= 300);
}
function tik(){
  AKTIV.sekunder--; visUr();
  if(AKTIV.sekunder % 5 === 0) gemIgang();
  if(AKTIV.sekunder <= 0){ clearInterval(urId); gem(); aflever(); }
}

/* ---------- kurve ---------- */
function kurve(liste){
  const n = liste.length;
  if(n < 2) return "";
  const b = 600, hh = 80, pad = 12, maks = 21;
  const x = function(i){ return pad + (i*(b-2*pad))/(n-1); };
  const y = function(p){ return hh - pad - ((p/maks)*(hh-2*pad)); };
  let d = "", prik = "";
  liste.forEach(function(r, i){
    d += (i ? " L " : "M ") + x(i).toFixed(1) + " " + y(r.point).toFixed(1);
    const sidste = i === n-1;
    prik += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.point).toFixed(1)+'" r="'+(sidste?5:3.5)+'" fill="'+(sidste?"#1D6B5B":"#C6D1C4")+'"/>'
      + '<text x="'+x(i).toFixed(1)+'" y="'+(y(r.point)-11).toFixed(1)+'" text-anchor="middle" font-size="12" fill="#5F6C64" font-family="-apple-system,Segoe UI,Roboto,sans-serif">'+r.point+'</text>';
  });
  return '<svg viewBox="0 0 '+b+' '+hh+'" preserveAspectRatio="none" role="img" aria-label="Point over tid">'
    + '<path d="'+d+'" fill="none" stroke="#1D6B5B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + prik + '</svg>';
}
function pil(nyv, gam){
  if(gam === null || gam === undefined) return "";
  if(nyv > gam) return '<span class="pil op">\u2191 +'+(nyv-gam)+'</span>';
  if(nyv < gam) return '<span class="pil ned">\u2193 '+(nyv-gam)+'</span>';
  return '<span class="pil lige">=</span>';
}

/* ---------- aflevering ---------- */
function aflever(){
  if(AKTIV.afleveret) return;
  AKTIV.afleveret = true;
  clearInterval(urId); gem(); gemIgang();

  const opg = AKTIV.opgaver;
  const ok = opg.map(function(o, i){ return rigtigt(o, AKTIV.svar[i]); });
  const point = ok.filter(Boolean).length, ialt = opg.length;
  const brugtTid = 45*60 - Math.max(AKTIV.sekunder, 0);
  const idag = new Date().toLocaleDateString("da-DK", {day:"numeric", month:"long", year:"numeric"});

  const omraader = {}, emner = {}, fejlNr = {};
  opg.forEach(function(o, i){
    omraader[o.o] = omraader[o.o] || [0,0]; omraader[o.o][1]++;
    emner[o.t] = emner[o.t] || [0,0]; emner[o.t][1]++;
    if(ok[i]){ omraader[o.o][0]++; emner[o.t][0]++; }
    else { fejlNr[o.t] = fejlNr[o.t] || []; fejlNr[o.t].push(i+1); }
  });
  const forkerte = Object.keys(fejlNr);

  const hist = historik();
  const sidst = hist.length ? hist[hist.length-1] : null;
  const bedsteFoer = hist.length ? Math.max.apply(null, hist.map(function(r){ return r.point; })) : null;
  const nyRekord = bedsteFoer !== null && point > bedsteFoer;
  const rettetOp = sidst && sidst.forkerte ? sidst.forkerte.filter(function(e){ return emner[e] && !fejlNr[e]; }) : [];
  const stadig = sidst && sidst.forkerte ? sidst.forkerte.filter(function(e){ return fejlNr[e]; }) : [];

  const denne = {dato:new Date().toISOString().slice(0,10), proeve:AKTIV.nr, navn:proeveNavn(AKTIV.nr),
    point:point, ialt:ialt, brugt:brugtTid, omraader:omraader, emner:emner, forkerte:forkerte};
  skriv(N_HIST, hist.concat([denne]));

  let ros;
  if(point === ialt) ros = "Fejlfrit, " + ELEV + ".";
  else if(nyRekord) ros = "Ny rekord, " + ELEV + ".";
  else if(rettetOp.length >= 2) ros = ELEV + ", du har rettet op p\u00e5 " + rettetOp.length + " emner siden sidst.";
  else if(sidst && point > sidst.point) ros = "Fremgang siden sidst, " + ELEV + ".";
  else ros = "S\u00e5 er den afleveret, " + ELEV + ".";

  let html = '<div class="udskriftshoved"><h1>'+proeveNavn(AKTIV.nr)+' \u00b7 Matematik, 7. klassetrin</h1><p>Rettet '+idag+' \u00b7 '+ELEV+'</p></div>';
  html += '<p class="roshoved ui">'+ros+'</p>';
  html += '<div class="score"><div class="score-tal">'+point+' <span>af '+ialt+'</span></div>'
    + '<p class="score-note ui">'+proeveNavn(AKTIV.nr)+' \u00b7 brugt tid '+Math.floor(brugtTid/60)+' min '+(brugtTid%60)+' sek'
    + (bedsteFoer !== null ? ' \u00b7 bedste hidtil '+bedsteFoer : '')+'.</p></div>';

  const maerker = [];
  if(nyRekord) maerker.push(["guld","\u2605","Ny rekord","Bedre end alt hvad du har lavet f\u00f8r"]);
  if(point === ialt) maerker.push(["guld","\u2605","Fejlfri","Alle "+ialt+" opgaver rigtige"]);
  Object.keys(omraader).forEach(function(o){
    if(omraader[o][0] === omraader[o][1]) maerker.push(["","\u25cf", o+" renset","Fuldt hus i omr\u00e5det"]);
  });
  if(rettetOp.length) maerker.push(["","\u21ba","Rettet op","Du fik styr p\u00e5 "+rettetOp.join(", ")]);
  if(brugtTid >= 1500 && point >= Math.ceil(ialt*0.7)) maerker.push(["","\u25d4","Grundig","Du tog dig tid til at regne efter"]);
  const antalTaget = hist.filter(function(r){ return r.proeve >= 1; }).length + 1;
  if(antalTaget >= 3) maerker.push(["","\u25a0","Vedholdende", antalTaget+" pr\u00f8ver taget"]);
  if(erNational(AKTIV.nr)) maerker.push(["guld","\u25c6","Nationaltest","Du tog den uden ekstra v\u00e6gtning"]);
  if(maerker.length){
    html += '<div class="maerker ui">' + maerker.slice(0,6).map(function(m){
      return '<div class="maerke '+m[0]+'"><b><em>'+m[1]+'</em>'+m[2]+'</b><span>'+m[3]+'</span></div>';
    }).join('') + '</div>';
  }

  html += '<h2 class="afsnit">Sammenlignet med sidst</h2><div class="udvikling ui">';
  Object.keys(omraader).forEach(function(o){
    const gam = (sidst && sidst.omraader && sidst.omraader[o]) ? sidst.omraader[o][0] : null;
    html += '<div class="r"><span>'+o+'</span><b>'+omraader[o][0]+'/'+omraader[o][1]+pil(omraader[o][0], gam)
      + (gam !== null ? '<span class="foer">sidst '+gam+'/'+sidst.omraader[o][1]+'</span>' : '')+'</b></div>';
  });
  html += '<div class="r"><span>I alt</span><b>'+point+'/'+ialt+pil(point, sidst ? sidst.point : null)
    + (sidst ? '<span class="foer">sidst '+sidst.point+'/'+sidst.ialt+'</span>' : '')+'</b></div></div>';

  const svg = kurve(hist.concat([denne]));
  if(svg) html += '<div class="kurve ui"><h3>Point over tid</h3><p>'+(hist.length+1)+' pr\u00f8ver, nyeste til h\u00f8jre.</p>'+svg+'</div>';

  if(rettetOp.length){
    html += '<div class="fokus loest ui"><h3>Rettet op siden sidst</h3><p class="led">Emner der drillede sidste gang, og som sad i dag.</p><ul>'
      + rettetOp.map(function(e){ return '<li><b>'+e+'</b> \u2014 '+emner[e][0]+' af '+emner[e][1]+' rigtige</li>'; }).join('') + '</ul></div>';
  }

  const svage = forkerte.sort(function(a,b){ return fejlNr[b].length - fejlNr[a].length; });
  if(svage.length){
    html += '<div class="fokus ui"><h3>Det skal der \u00f8ves p\u00e5</h3><p class="led">Emner med mindst \u00e9n fejl. De v\u00e6gtes op i n\u00e6ste pr\u00f8ve.</p><ul>'
      + svage.map(function(e){
          return '<li><b>'+e+'</b> \u2014 '+emner[e][0]+' af '+emner[e][1]+' rigtige <span>(opgave '+fejlNr[e].join(", ")
            + (stadig.indexOf(e) !== -1 ? ' \u00b7 ogs\u00e5 galt sidst' : '')+')</span></li>';
        }).join('') + '</ul></div>';
  }else{
    html += '<div class="fokus alt-rigtigt ui"><h3>Ingen fejl</h3><p class="led">Alt rigtigt hele vejen igennem.</p></div>';
  }

  html += '<div class="navigation ui" style="margin-top:28px">'
    + '<button class="knap" onclick="window.print()">Print resultatet</button>'
    + '<button class="knap sekundaer" id="tiloversigt">Tilbage til oversigten</button></div>';

  html += '<h2 class="afsnit">Gennemgang</h2>';
  opg.forEach(function(o, i){
    const dit = (AKTIV.svar[i] || "").trim();
    html += '<div class="rettelse '+(ok[i]?'ja':'nej')+'"><p class="emne">'+(i+1)+'. '+o.t+'</p><h3>'+o.q+'</h3>'
      + (ok[i] ? '<p class="facit">Rigtigt: <b>'+o.f+'</b></p>'
               : '<p class="dit ui">Dit svar: '+(dit ? '<i>'+dit+'</i>' : 'tomt')+'</p><p class="facit">Facit: <b>'+o.f+'</b></p>')
      + '<p class="hvorfor ui">'+o.h+'</p></div>';
  });

  el("resultat").innerHTML = html;
  el("tiloversigt").addEventListener("click", function(){ tegnOversigt(); });
  vis("resultat");
}

/* ---------- hændelser ---------- */
el("naeste").addEventListener("click", function(){ gem(); if(AKTIV.nu < AKTIV.opgaver.length-1){ AKTIV.nu++; visOpgave(); gemIgang(true); } });
el("forrige").addEventListener("click", function(){ gem(); if(AKTIV.nu > 0){ AKTIV.nu--; visOpgave(); gemIgang(true); } });
el("aflever").addEventListener("click", aflever);
el("afbryd").addEventListener("click", function(){ gem(); gemIgang(); clearInterval(urId); tegnOversigt(); });
el("svar").addEventListener("input", function(){ gem(); tegnFelter(); });
el("svar").addEventListener("change", function(){ gem(); gemIgang(true); });
el("svar").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault(); gem(); gemIgang(true);
    if(AKTIV.nu < AKTIV.opgaver.length-1){ AKTIV.nu++; visOpgave(); } else aflever();
  }
});
document.addEventListener("visibilitychange", function(){
  if(!AKTIV || AKTIV.afleveret) return;
  if(document.hidden){ gem(); gemIgang(); clearInterval(urId); }
  else { clearInterval(urId); urId = setInterval(tik, 1000); }
});
window.addEventListener("pagehide", function(){ if(AKTIV && !AKTIV.afleveret){ gem(); gemIgang(); } });

tegnOversigt();

</script>
</body>
</html>
